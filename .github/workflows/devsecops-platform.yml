name: DevSecOps Platform Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - kafka
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: tuananh165
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go tests
        run: make test

      - name: Realtime race tests
        run: go test -race ./pkg/realtime ./pkg/presence ./pkg/notification ./pkg/call ./pkg/chat

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: AI service install
        working-directory: ai-service
        run: python -m pip install -e ".[dev]"

      - name: AI service lint
        working-directory: ai-service
        run: python -m ruff check .

      - name: AI service tests
        working-directory: ai-service
        run: python -m pytest

  helm:
    name: Helm Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deployments/helm/nexuschat

      - name: Helm template
        run: helm template nexuschat deployments/helm/nexuschat --namespace nexuschat-staging > rendered-nexuschat.yaml

      - name: Helm template lab 4GB profile
        run: helm template nexuschat deployments/helm/nexuschat --namespace nexuschat-lab --values deployments/helm/nexuschat/values.yaml --values deployments/helm/nexuschat/values-lab-k3s.yaml > rendered-nexuschat-lab.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-nexuschat
          path: |
            rendered-nexuschat.yaml
            rendered-nexuschat-lab.yaml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  build-images:
    name: Build, Scan, Sign Images
    needs:
      - test
      - helm
      - secret-scan
      - codeql
      - trivy-fs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: build/Dockerfile.api
            context: .
          - name: web
            dockerfile: build/Dockerfile.web
            context: .
          - name: ai-service
            dockerfile: ai-service/Dockerfile
            context: ai-service
          - name: presence
            dockerfile: build/Dockerfile.realtime
            context: .
            service: presence
          - name: notification
            dockerfile: build/Dockerfile.realtime
            context: .
            service: notification
          - name: call
            dockerfile: build/Dockerfile.realtime
            context: .
            service: call
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          case "${{ matrix.name }}" in
            api)
              repo="nexuschat-api"
              ;;
            web)
              repo="nexuschat-web"
              ;;
            ai-service)
              repo="nexuschat-ai-service"
              ;;
            presence)
              repo="nexuschat-presence"
              ;;
            notification)
              repo="nexuschat-notification"
              ;;
            call)
              repo="nexuschat-call"
              ;;
            *)
              echo "Unknown image name: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac
          echo "image=${REGISTRY}/${IMAGE_NAMESPACE}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            SERVICE=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}

  build-proxy-variants:
    name: Build Proxy Variant Images
    needs:
      - build-images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push api proxy-upload
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.api
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-api:proxy-upload
            docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web proxy-upload
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.web
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-web:proxy-upload
            docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web proxy-upload-v2
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.web-patch
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-web:proxy-upload-v2
            docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-lab-k8s:
    name: Deploy to K8s Lab
    needs:
      - build-images
      - build-proxy-variants
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, k3s-lab]
    env:
      KUBE_NAMESPACE: nexuschat-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deploy tag
        id: vars
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig from secret when provided
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [[ -n "$KUBECONFIG_B64" ]]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          else
            echo "KUBE_CONFIG_B64 is empty; using runner's existing kubeconfig"
          fi

      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
          kubectl get nodes -o wide
          kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure cert-manager and Let's Encrypt issuer
        run: |
          set -euo pipefail
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m
          kubectl wait --for=condition=Established crd/certificates.cert-manager.io crd/clusterissuers.cert-manager.io --timeout=120s

      - name: Ensure TURN shared secret
        env:
          TURN_SHARED_SECRET: ${{ secrets.CALL_TURN_SHAREDSECRET }}
        run: |
          set -euo pipefail
          if kubectl -n "$KUBE_NAMESPACE" get secret nexuschat-runtime -o jsonpath='{.data.CALL_TURN_SHAREDSECRET}' 2>/dev/null | grep -q .; then
            echo "nexuschat-runtime already contains CALL_TURN_SHAREDSECRET"
            exit 0
          fi

          if [[ -z "$TURN_SHARED_SECRET" ]]; then
            TURN_SHARED_SECRET="$(openssl rand -hex 32)"
          fi

          if kubectl -n "$KUBE_NAMESPACE" get secret nexuschat-runtime >/dev/null 2>&1; then
            encoded_secret="$(printf '%s' "$TURN_SHARED_SECRET" | base64 -w0)"
            kubectl -n "$KUBE_NAMESPACE" patch secret nexuschat-runtime \
              --type merge \
              -p "{\"data\":{\"CALL_TURN_SHAREDSECRET\":\"${encoded_secret}\"}}"
          else
            kubectl -n "$KUBE_NAMESPACE" create secret generic nexuschat-runtime \
              --from-literal=CALL_TURN_SHAREDSECRET="$TURN_SHARED_SECRET"
          fi

      - name: Helm upgrade lab release
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Do not use helm --wait/--atomic here. Helm waits on cert-manager
          # Certificate readiness too, and Let's Encrypt HTTP-01 can remain
          # InProgress while DNS/public reachability is being fixed. The next
          # steps wait on runtime workloads explicitly so app rollout failures
          # still fail the pipeline with clearer diagnostics.
          helm upgrade --install nexuschat deployments/helm/nexuschat \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            --values deployments/helm/nexuschat/values.yaml \
            --values deployments/helm/nexuschat/values-lab-k3s.yaml \
            --set-string imageDefaults.tag="${TAG}" \
            --set-string services.web.image.fullname=docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${TAG} \
            --set-string services.uploader.image.fullname=docker.io/tuananh165/nexuschat-api:proxy-upload-${TAG} \
            --timeout 10m

      - name: Wait for deployments
        run: |
          for deploy in web chat match user uploader forwarder ai-service presence notification call; do
            echo "Waiting for rollout: $deploy"
            kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$deploy --timeout=600s
          done

      - name: Wait for coturn daemonset
        run: |
          kubectl -n "$KUBE_NAMESPACE" rollout status daemonset/coturn --timeout=180s

      - name: Show TLS certificate status
        if: always()
        run: |
          kubectl -n "$KUBE_NAMESPACE" get certificate,certificaterequest,order,challenge -o wide || true
          kubectl -n "$KUBE_NAMESPACE" describe certificate nexuschat-click-tls || true

      - name: Show deployed images
        run: |
          kubectl -n "$KUBE_NAMESPACE" get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" => "}{range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}{end}'

      - name: Realtime service smoke checks
        run: |
          for target in presence:5005 notification:5006 call:5007; do
            name="${target%%:*}"
            kubectl -n "$KUBE_NAMESPACE" run "smoke-${name}-${GITHUB_RUN_ID}" \
              --image=curlimages/curl:8.12.1 --restart=Never --rm --attach \
              --command -- curl --fail --max-time 10 "http://${target}/ready"
          done
