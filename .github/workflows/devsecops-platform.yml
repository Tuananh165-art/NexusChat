name: DevSecOps Platform Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
      - kafka
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: tuananh165
  GO_VERSION: "1.25.12"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go tests
        run: make test

      - name: Realtime race tests
        run: go test -race ./pkg/realtime ./pkg/safety ./pkg/discovery ./pkg/workspace ./pkg/chat ./pkg/match

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: AI service install
        working-directory: ai-service
        run: python -m pip install -e ".[dev]"

      - name: AI service lint
        working-directory: ai-service
        run: python -m ruff check .

      - name: AI service tests
        working-directory: ai-service
        run: python -m pytest

  helm:
    name: Helm Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deployments/helm/nexuschat

      - name: Helm template
        run: helm template nexuschat deployments/helm/nexuschat --namespace nexuschat-staging > rendered-nexuschat.yaml

      - name: Helm template lab 4GB profile
        run: helm template nexuschat deployments/helm/nexuschat --namespace nexuschat-lab --values deployments/helm/nexuschat/values.yaml --values deployments/helm/nexuschat/values-lab-k3s.yaml > rendered-nexuschat-lab.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-nexuschat
          path: |
            rendered-nexuschat.yaml
            rendered-nexuschat-lab.yaml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy filesystem SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-images:
    name: Build, Scan, Sign Images
    needs:
      - test
      - helm
      - secret-scan
      - codeql
      - trivy-fs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: build/Dockerfile.api
            context: .
          - name: web
            dockerfile: build/Dockerfile.web
            context: .
          - name: ai-service
            dockerfile: ai-service/Dockerfile
            context: ai-service
          - name: safety
            dockerfile: build/Dockerfile.realtime
            context: .
            service: safety
          - name: discovery
            dockerfile: build/Dockerfile.realtime
            context: .
            service: discovery
          - name: workspace
            dockerfile: build/Dockerfile.realtime
            context: .
            service: workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          case "${{ matrix.name }}" in
            api)
              repo="nexuschat-api"
              ;;
            web)
              repo="nexuschat-web"
              ;;
            ai-service)
              repo="nexuschat-ai-service"
              ;;
            safety)
              repo="nexuschat-safety"
              ;;
            discovery)
              repo="nexuschat-discovery"
              ;;
            workspace)
              repo="nexuschat-workspace"
              ;;
            *)
              echo "Unknown image name: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac
          echo "image=${REGISTRY}/${IMAGE_NAMESPACE}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            SERVICE=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy image SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif

      - name: Upload image scan SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Push image after security gates
        run: |
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ steps.vars.outputs.image }}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker push "${{ steps.vars.outputs.image }}:latest"
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image tags
        run: |
          cosign sign --yes "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          cosign sign --yes "${{ steps.vars.outputs.image }}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cosign sign --yes "${{ steps.vars.outputs.image }}:latest"
          fi

  build-proxy-variants:
    name: Build Proxy Variant Images
    needs:
      - build-images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build api proxy-upload image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.api
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-api:proxy-upload
            docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web proxy-upload image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.web
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-web:proxy-upload
            docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web proxy-upload-v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.web-patch
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            docker.io/tuananh165/nexuschat-web:proxy-upload-v2
            docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gate api proxy-upload image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate api proxy-upload image SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-proxy-api.sarif

      - name: Upload api proxy scan SARIF
        if: always() && hashFiles('trivy-proxy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-proxy-api.sarif
          category: trivy-proxy-api

      - name: Gate web proxy-upload image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate web proxy-upload image SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-proxy-web.sarif

      - name: Upload web proxy scan SARIF
        if: always() && hashFiles('trivy-proxy-web.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-proxy-web.sarif
          category: trivy-proxy-web

      - name: Gate web proxy-upload-v2 image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate web proxy-upload-v2 image SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-proxy-web-v2.sarif

      - name: Upload web proxy-upload-v2 scan SARIF
        if: always() && hashFiles('trivy-proxy-web-v2.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-proxy-web-v2.sarif
          category: trivy-proxy-web-v2

      - name: Generate proxy image SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-proxy-api.spdx.json

      - name: Generate web proxy image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-proxy-web.spdx.json

      - name: Generate web proxy-upload-v2 SBOM
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom-proxy-web-v2.spdx.json

      - name: Upload proxy image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-proxy-images
          path: sbom-proxy-*.spdx.json

      - name: Push proxy images after security gates
        run: |
          docker push docker.io/tuananh165/nexuschat-api:proxy-upload
          docker push docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          docker push docker.io/tuananh165/nexuschat-web:proxy-upload
          docker push docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          docker push docker.io/tuananh165/nexuschat-web:proxy-upload-v2
          docker push docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign proxy images
        run: |
          cosign sign --yes docker.io/tuananh165/nexuschat-api:proxy-upload
          cosign sign --yes docker.io/tuananh165/nexuschat-api:proxy-upload-${{ steps.vars.outputs.tag }}
          cosign sign --yes docker.io/tuananh165/nexuschat-web:proxy-upload
          cosign sign --yes docker.io/tuananh165/nexuschat-web:proxy-upload-${{ steps.vars.outputs.tag }}
          cosign sign --yes docker.io/tuananh165/nexuschat-web:proxy-upload-v2
          cosign sign --yes docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${{ steps.vars.outputs.tag }}

  deploy-lab-k8s:
    name: Deploy to K8s Lab
    needs:
      - build-images
      - build-proxy-variants
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, k3s-lab]
    env:
      KUBE_NAMESPACE: nexuschat-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Preserve server-local ignored files such as .env and ai-service/.env.
          clean: false

      - name: Set deploy tag
        id: vars
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig from secret when provided
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [[ -n "$KUBECONFIG_B64" ]]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          else
            echo "KUBE_CONFIG_B64 is empty; using runner's existing kubeconfig"
          fi

      - name: Verify cluster access
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl config current-context
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
          for attempt in {1..12}; do
            if kubectl --request-timeout=60s get --raw=/readyz >/tmp/kube-readyz; then
              cat /tmp/kube-readyz
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Kubernetes /readyz did not report clean readiness after ${attempt} attempts; continuing to node check" >&2
              break
            fi
            echo "Kubernetes API is not ready yet; retrying in 10s (${attempt}/12)"
            sleep 10
          done
          kubectl --request-timeout=60s get nodes -o wide
          kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -

      - name: Deploy Jaeger and OpenTelemetry Collector
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if kubectl --request-timeout=60s apply -f deployments/platform/observability; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Failed to apply observability manifests after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Kubernetes API/apply failed while deploying observability; checking readiness before retry ${attempt}/6"
            kubectl --request-timeout=30s get --raw=/readyz || true
            sleep 15
          done

      - name: Deploy dashboard applications
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if kubectl --request-timeout=60s apply -f deployments/platform/dashboards && \
               kubectl --request-timeout=60s apply -f deployments/platform/monitoring/standalone-monitoring.yaml && \
               kubectl --request-timeout=60s apply -f deployments/platform/monitoring/ingresses.yaml; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Failed to apply dashboard manifests after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Kubernetes API/apply failed while deploying dashboards; checking readiness before retry ${attempt}/6"
            kubectl --request-timeout=30s get --raw=/readyz || true
            sleep 15
          done

      - name: Restore lab data dependencies
        run: |
          set -euo pipefail

          kubectl --request-timeout=60s apply -f deployments/platform/kafka
          kubectl --request-timeout=60s apply -f deployments/platform/cassandra
          kubectl --request-timeout=60s apply -f deployments/platform/minio

          helm upgrade --install redis oci://registry-1.docker.io/bitnamicharts/redis-cluster \
            --version 13.0.4 \
            --namespace redis \
            --create-namespace \
            --values deployments/platform/redis/redis-cluster-values.yaml \
            --timeout 5m
          kubectl --request-timeout=60s -n redis rollout status statefulset/redis-redis-cluster --timeout=300s

          redis_pod_ips="$(kubectl --request-timeout=60s -n redis get pods -l app.kubernetes.io/instance=redis,app.kubernetes.io/name=redis-cluster -o jsonpath='{.items[*].status.podIP}')"
          redis_endpoint_ips="$(kubectl --request-timeout=60s -n redis get endpoints redis-redis-cluster -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
          redis_cluster_ips="$(kubectl --request-timeout=60s -n redis exec redis-redis-cluster-0 -- bash -lc 'export REDISCLI_AUTH=$(cat /opt/bitnami/redis/secrets/redis-password); redis-cli -h 127.0.0.1 -p 6379 cluster nodes' 2>/dev/null | awk '{print $2}' | cut -d: -f1 | sort -u || true)"
          for ip in $redis_pod_ips; do
            if [[ " $redis_endpoint_ips " != *" $ip "* || " $redis_cluster_ips " != *" $ip "* ]]; then
              echo "Redis Cluster endpoints/slot metadata do not match pod IPs; resetting lab Redis PVCs to avoid stale cluster slot metadata"
              kubectl --request-timeout=60s -n redis scale statefulset redis-redis-cluster --replicas=0
              kubectl --request-timeout=60s -n redis delete pvc \
                redis-data-redis-redis-cluster-0 \
                redis-data-redis-redis-cluster-1 \
                redis-data-redis-redis-cluster-2 \
                --ignore-not-found --timeout=180s
              helm upgrade --install redis oci://registry-1.docker.io/bitnamicharts/redis-cluster \
                --version 13.0.4 \
                --namespace redis \
                --create-namespace \
                --values deployments/platform/redis/redis-cluster-values.yaml \
                --timeout 5m
              kubectl --request-timeout=60s -n redis rollout status statefulset/redis-redis-cluster --timeout=300s
              break
            fi
          done

          wait_endpoint() {
            local namespace="$1"
            local service="$2"
            local port_label="$3"
            for attempt in {1..30}; do
              endpoints="$(kubectl --request-timeout=60s -n "$namespace" get endpoints "$service" -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
              if [[ -n "$endpoints" ]]; then
                echo "$namespace/$service has endpoints: $endpoints"
                return 0
              fi
              echo "Waiting for $namespace/$service endpoint on $port_label (${attempt}/30)"
              sleep 10
            done
            echo "$namespace/$service has no ready endpoints after waiting" >&2
            kubectl --request-timeout=60s -n "$namespace" get deploy,statefulset,pods,svc,endpoints -o wide || true
            return 1
          }

          wait_endpoint kafka kafka 9092
          wait_endpoint redis redis-redis-cluster 6379
          wait_endpoint cassandra cassandra 9042
          wait_endpoint minio minio 9000

      - name: Sync environment files to Kubernetes Secrets
        env:
          TURN_SHARED_SECRET: ${{ secrets.CALL_TURN_SHAREDSECRET }}
        run: |
          set -euo pipefail
          root_env_file="$GITHUB_WORKSPACE/.env"
          ai_env_file="$GITHUB_WORKSPACE/ai-service/.env"

          validate_env_file() {
            local env_file="$1"
            [[ -s "$env_file" ]] || return 0
            if grep -nE '^[[:space:]]*export[[:space:]]+[A-Za-z_][A-Za-z0-9_]*=' "$env_file"; then
              echo "The .env files must use KEY=VALUE entries, not shell export statements" >&2
              exit 1
            fi
          }

          sync_secret_from_env_or_keep_existing() {
            local secret_name="$1"
            local env_file="$2"
            if [[ -s "$env_file" ]]; then
              kubectl -n "$KUBE_NAMESPACE" create secret generic "$secret_name" \
                --from-env-file="$env_file" \
                --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
              return 0
            fi
            if kubectl --request-timeout=60s -n "$KUBE_NAMESPACE" get secret "$secret_name" >/dev/null 2>&1; then
              echo "$env_file is missing or empty; preserving existing Kubernetes Secret/$secret_name"
              return 0
            fi
            echo "Missing or empty $env_file and Kubernetes Secret/$secret_name does not exist" >&2
            exit 1
          }

          validate_env_file "$root_env_file"
          validate_env_file "$ai_env_file"

          # Preserve the existing TURN value across deploys. Fall back to the GitHub
          # secret or generate one only when the Kubernetes Secret has no value yet.
          turn_shared_secret="$(kubectl -n "$KUBE_NAMESPACE" get secret nexuschat-runtime \
            -o jsonpath='{.data.CALL_TURN_SHAREDSECRET}' 2>/dev/null | base64 --decode 2>/dev/null || true)"
          grpc_shared_secret="$(kubectl -n "$KUBE_NAMESPACE" get secret nexuschat-runtime \
            -o jsonpath='{.data.NEXUSCHAT_GRPC_SHARED_SECRET}' 2>/dev/null | base64 --decode 2>/dev/null || true)"
          if [[ -z "$turn_shared_secret" ]]; then
            turn_shared_secret="$TURN_SHARED_SECRET"
          fi
          if [[ -z "$turn_shared_secret" ]]; then
            turn_shared_secret="$(openssl rand -hex 32)"
          fi
          if [[ -z "$grpc_shared_secret" ]]; then
            grpc_shared_secret="$(openssl rand -hex 32)"
          fi

          redis_password_b64="$(kubectl --request-timeout=60s -n redis get secret redis-redis-cluster \
            -o jsonpath='{.data.redis-password}' 2>/dev/null || true)"
          if [[ -z "$redis_password_b64" ]]; then
            echo "Missing redis/redis-redis-cluster redis-password; cannot sync NexusChat Redis credentials" >&2
            exit 1
          fi

          sync_secret_from_env_or_keep_existing nexuschat-runtime "$root_env_file"

          encoded_turn="$(printf '%s' "$turn_shared_secret" | base64 | tr -d '\n')"
          encoded_grpc="$(printf '%s' "$grpc_shared_secret" | base64 | tr -d '\n')"
          kubectl --request-timeout=60s -n "$KUBE_NAMESPACE" patch secret nexuschat-runtime \
            --type merge \
            -p "{\"data\":{\"CALL_TURN_SHAREDSECRET\":\"${encoded_turn}\",\"NEXUSCHAT_GRPC_SHARED_SECRET\":\"${encoded_grpc}\",\"REDIS_PASSWORD\":\"${redis_password_b64}\"}}"

          sync_secret_from_env_or_keep_existing nexuschat-ai-service "$ai_env_file"

      - name: Helm upgrade lab release
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail

          release_status="$(helm -n "$KUBE_NAMESPACE" status nexuschat -o json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["status"])' 2>/dev/null || true)"
          if [[ "$release_status" == pending-* ]]; then
            pending_revision="$(helm -n "$KUBE_NAMESPACE" history nexuschat -o json | python3 -c 'import json,sys; print(max(item["revision"] for item in json.load(sys.stdin)))')"
            echo "Helm release nexuschat is ${release_status} at revision ${pending_revision}; deleting stale release lock before upgrade"
            kubectl --request-timeout=60s -n "$KUBE_NAMESPACE" delete secret "sh.helm.release.v1.nexuschat.v${pending_revision}"
          fi

          kubectl --request-timeout=60s -n "$KUBE_NAMESPACE" delete job nexuschat-cassandra-migration --ignore-not-found

          helm_hook_args=()
          cassandra_endpoints="$(kubectl --request-timeout=60s -n cassandra get endpoints cassandra -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
          if [[ -z "$cassandra_endpoints" ]]; then
            echo "Cassandra has no ready endpoints; skipping Helm hooks so the lab release metadata can still be updated."
            helm_hook_args+=(--no-hooks)
          fi

          # Wait explicitly for application rollouts so failures are reported with clear diagnostics.
          helm upgrade --install nexuschat deployments/helm/nexuschat \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            "${helm_hook_args[@]}" \
            --values deployments/helm/nexuschat/values.yaml \
            --values deployments/helm/nexuschat/values-lab-k3s.yaml \
            --set-string imageDefaults.tag="${TAG}" \
            --set-string services.web.image.fullname=docker.io/tuananh165/nexuschat-web:proxy-upload-v2-${TAG} \
            --set-string services.uploader.image.fullname=docker.io/tuananh165/nexuschat-api:proxy-upload-${TAG} \
            --timeout 10m

      - name: Wait for deployments
        run: |
          set -euo pipefail

          kafka_endpoints="$(kubectl --request-timeout=60s -n kafka get endpoints kafka -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
          redis_endpoints="$(kubectl --request-timeout=60s -n redis get endpoints redis-redis-cluster -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
          cassandra_endpoints="$(kubectl --request-timeout=60s -n cassandra get endpoints cassandra -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"

          wait_required() {
            local deploy="$1"
            echo "Waiting for rollout: $deploy"
            kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$deploy --timeout=600s
          }

          wait_best_effort() {
            local deploy="$1"
            echo "Waiting for rollout: $deploy"
            if ! kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$deploy --timeout=120s; then
              echo "Deployment/$deploy is not ready; continuing because one or more lab dependencies are unavailable."
              kubectl -n "$KUBE_NAMESPACE" get deployment/$deploy -o wide || true
            fi
          }

          wait_required web
          wait_required ai-service

          if [[ -z "$kafka_endpoints" || -z "$redis_endpoints" || -z "$cassandra_endpoints" ]]; then
            echo "Skipping strict rollout waits for dependency-backed services. Dependency endpoints: kafka='${kafka_endpoints:-none}' redis='${redis_endpoints:-none}' cassandra='${cassandra_endpoints:-none}'"
            for deploy in chat match user uploader forwarder safety discovery workspace; do
              wait_best_effort "$deploy"
            done
          else
            for deploy in chat match user uploader forwarder safety discovery workspace; do
              wait_required "$deploy"
            done
          fi

      - name: Wait for coturn daemonset
        run: |
          if kubectl -n "$KUBE_NAMESPACE" get daemonset/coturn >/dev/null 2>&1; then
            kubectl -n "$KUBE_NAMESPACE" rollout status daemonset/coturn --timeout=180s
          else
            echo "coturn DaemonSet is not rendered in this lab profile; skipping TURN rollout wait."
          fi

      - name: Show deployed images
        run: |
          kubectl -n "$KUBE_NAMESPACE" get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" => "}{range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}{end}'

      - name: Realtime service smoke checks
        run: |
          set -euo pipefail
          for target in safety:5005 discovery:5006 workspace:5007; do
            name="${target%%:*}"
            available="$(kubectl --request-timeout=60s -n "$KUBE_NAMESPACE" get deployment "$name" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)"
            if [[ "${available:-0}" == "0" ]]; then
              echo "Deployment/$name has no available replicas; skipping smoke check in degraded lab."
              continue
            fi
            kubectl -n "$KUBE_NAMESPACE" run "smoke-${name}-${GITHUB_RUN_ID}" \
              --image=curlimages/curl:8.12.1 --restart=Never --rm --attach \
              --command -- curl --fail --max-time 10 "http://${target}/ready"
          done
