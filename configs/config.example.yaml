web:
  http:
    server:
      port: "80"
chat:
  http:
    server:
      port: "80"
      maxConn: 200
      swag: true
  grpc:
    server:
      port: "4000"
    client:
      user:
        endpoint: "localhost:4001"
      forwarder:
        endpoint: "localhost:4002"
  subscriber:
    id: mychatserver
  message:
    maxNum: 5000
    paginationNum: 5000
    maxSizeByte: 4096
  jwt:
    secret: mysecret
    expirationSecond: 86400
ai:
  baseURL: "http://localhost:8090"
  requestTimeoutMilli: 30000
forwarder:
  grpc:
    server:
      port: "4002" 
safety:
  http:
    server:
      port: "5005"
  grpc:
    server:
      port: "4003"
  warnScore: 40
  blockScore: 70
  rateLimit:
    windowSecond: 10
    maxMessages: 12
    muteSecond: 30
  workers: 4
discovery:
  http:
    server:
      port: "5006"
  grpc:
    server:
      port: "4004"
    client:
      safety:
        endpoint: "localhost:4003"
  candidateLimit: 20
  recentPeerDay: 7
  workers: 4
workspace:
  http:
    server:
      port: "5007"
  grpc:
    server:
      port: "4005"
    client:
      chat:
        endpoint: "localhost:4000"
  workers: 4
  reminderPollSecond: 15
notification:
  pollIntervalSecond: 2
  leaseSecond: 30
  maxAttempts: 8
  baseRetrySecond: 1
  maxRetrySecond: 900
  batchSize: 50
  workerID: ""
match:
  http:
    server:
      port: "80"
      maxConn: 200
      swag: true
  grpc:
    client:
      chat:
        endpoint: "localhost:4000"
      user:
        endpoint: "localhost:4001"
      safety:
        endpoint: "localhost:4003"
      discovery:
        endpoint: "localhost:4004"
uploader:
  http:
    server:
      port: "80"
      swag: true
      maxBodyByte: 67108864
      maxMemoryByte: 16777216
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: myfilebucket
    accessKey: testaccesskey
    secretKey: testsecret
    presignLifetimeSecond: 86400
  rateLimit:
    channelUpload:
      rps: 200
      burst: 50
user:
  http:
    server:
      port: "80"
      swag: true
  grpc:
    server:
      port: "4001"
  oauth:
    cookie:
      maxAge: 3600
      path: "/"
      domain: ""
      secure: false
      httpOnly: true
      sameSite: "lax"
    google:
      redirectUrl: "http://localhost/api/user/oauth2/google/callback"
      clientId: ""
      clientSecret: ""
      scopes: "https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/userinfo.profile"
  auth:
    cookie:
      maxAge: 86400
      path: "/"
      domain: ""
      secure: false
      httpOnly: true
      sameSite: "lax"
kafka:
  addrs: kafka-0:9092,kafka-1:9092,kafka-2:9092
  version: "3.0.1"
cassandra:
  hosts: cassandra-host-0,cassandra-host-1,cassandra-host-2
  port: 9042
  user: admin
  password: nexuschat165
  keyspace: NexusChat
redis:
  password: pass.123
  addrs: redis-node-0:6379,redis-node-1:6379,redis-node-2:6379
  expirationHour: 24
  minIdleConn: 30
  poolSize: 500
  readTimeoutMilliSecond: 500
  writeTimeoutMilliSecond: 500
observability:
  prometheus:
    port: "8080"
  tracing:
    otlpEndpoint: "localhost:4318"
