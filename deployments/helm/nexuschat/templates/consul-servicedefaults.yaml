{{- if .Values.consul.serviceDefaults.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: {{ $name }}
spec:
  protocol: {{ ternary "grpc" "http" (and $svc.grpcPort (not $svc.path)) }}
{{- end }}
{{- end }}
{{- end }}
