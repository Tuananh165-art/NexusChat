{{- if .Values.turn.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coturn
  labels:
    {{- include "nexuschat.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexuschat.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: {{ .Values.turn.image }}
          args:
            - -n
            - --log-file=stdout
            - --fingerprint
            - --use-auth-secret
            - --static-auth-secret=$(TURN_SHARED_SECRET)
            - --realm={{ .Values.turn.realm }}
            - --no-cli
            - --min-port={{ .Values.turn.minPort }}
            - --max-port={{ .Values.turn.maxPort }}
          env:
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexuschat-runtime
                  key: CALL_TURN_SHAREDSECRET
          ports:
            - name: turn-tcp
              containerPort: 3478
              hostPort: 3478
              protocol: TCP
            - name: turn-udp
              containerPort: 3478
              hostPort: 3478
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
{{- end }}
