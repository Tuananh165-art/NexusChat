{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "nexuschat.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 5
  {{- $strategy := default $.Values.global.deploymentStrategy $svc.deploymentStrategy }}
  {{- if $strategy }}
  strategy:
    type: {{ default "RollingUpdate" $strategy.type }}
    {{- if and (eq (default "RollingUpdate" $strategy.type) "RollingUpdate") $strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexuschat.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        # Release revisions force a new ReplicaSet even when a mutable image
        # alias is reused. Production deployments should still use SHA tags.
        nexuschat.io/helm-release-revision: {{ $.Release.Revision | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ $svc.metricsPort }}"
        {{- with $.Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "nexuschat.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ default $.Values.imageDefaults.pullPolicy $svc.image.pullPolicy }}
          {{- if $svc.command }}
          args:
            {{- toYaml $svc.command | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
            {{- if and $svc.metricsPort (ne (toString $svc.metricsPort) (toString $svc.containerPort)) }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
            {{- end }}
            {{- if and $svc.grpcPort (ne (toString $svc.grpcPort) (toString $svc.containerPort)) }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          env:
            - name: NEXUSCHAT_ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            {{- range $key, $value := $.Values.global.commonEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if has $name (list "chat" "match" "user" "safety" "discovery" "workspace" "forwarder") }}
            - name: NEXUSCHAT_GRPC_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default "nexuschat-runtime" $.Values.global.grpcSharedSecretSecretName }}
                  key: NEXUSCHAT_GRPC_SHARED_SECRET
                  optional: false
            {{- if $.Values.grpcSecurity.enabled }}
            - name: NEXUSCHAT_GRPC_ASSERTION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.grpcSecurity.assertionSecretName }}
                  key: NEXUSCHAT_GRPC_ASSERTION_KEY_ID
                  optional: false
            - name: NEXUSCHAT_GRPC_ASSERTION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.grpcSecurity.assertionSecretName }}
                  key: NEXUSCHAT_GRPC_ASSERTION_PRIVATE_KEY
                  optional: false
            - name: NEXUSCHAT_GRPC_ASSERTION_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.grpcSecurity.assertionSecretName }}
                  key: NEXUSCHAT_GRPC_ASSERTION_PUBLIC_KEY
                  optional: false
            - name: NEXUSCHAT_GRPC_TLS_ENABLED
              value: "true"
            - name: NEXUSCHAT_GRPC_TLS_CA_FILE
              value: {{ printf "%s/ca.crt" $.Values.grpcSecurity.mountPath | quote }}
            - name: NEXUSCHAT_GRPC_TLS_CLIENT_CERT_FILE
              value: {{ printf "%s/client.crt" $.Values.grpcSecurity.mountPath | quote }}
            - name: NEXUSCHAT_GRPC_TLS_CLIENT_KEY_FILE
              value: {{ printf "%s/client.key" $.Values.grpcSecurity.mountPath | quote }}
            - name: NEXUSCHAT_GRPC_TLS_SERVER_CERT_FILE
              value: {{ printf "%s/server.crt" $.Values.grpcSecurity.mountPath | quote }}
            - name: NEXUSCHAT_GRPC_TLS_SERVER_KEY_FILE
              value: {{ printf "%s/server.key" $.Values.grpcSecurity.mountPath | quote }}
            - name: NEXUSCHAT_GRPC_TLS_SERVER_NAME
              value: {{ $.Values.grpcSecurity.serverName | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- $envFromSecrets := default $.Values.global.envFromSecrets $svc.envFromSecrets }}
          {{- if $envFromSecrets }}
          envFrom:
            {{- range $envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if and $.Values.grpcSecurity.enabled (has $name (list "chat" "match" "user" "safety" "discovery" "workspace" "forwarder")) }}
          volumeMounts:
            - name: grpc-tls
              mountPath: {{ $.Values.grpcSecurity.mountPath | quote }}
              readOnly: true
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if or (not (hasKey $svc "probesEnabled")) $svc.probesEnabled }}
          {{- if or $svc.healthPath $svc.readinessPath }}
          livenessProbe:
            httpGet:
              path: {{ default "/health" $svc.healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ default "/ready" $svc.readinessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- if and $.Values.grpcSecurity.enabled (has $name (list "chat" "match" "user" "safety" "discovery" "workspace" "forwarder")) }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ $.Values.grpcSecurity.tlsSecretName }}
            optional: false
      {{- end }}
{{- end }}
{{- end }}
