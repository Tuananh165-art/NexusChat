{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "nexuschat.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 5
  {{- $strategy := default $.Values.global.deploymentStrategy $svc.deploymentStrategy }}
  {{- if $strategy }}
  strategy:
    type: {{ default "RollingUpdate" $strategy.type }}
    {{- if and (eq (default "RollingUpdate" $strategy.type) "RollingUpdate") $strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexuschat.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ $svc.metricsPort }}"
        {{- with $.Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "nexuschat.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ default $.Values.imageDefaults.pullPolicy $svc.image.pullPolicy }}
          {{- if $svc.command }}
          args:
            {{- toYaml $svc.command | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
            {{- if and $svc.metricsPort (ne (toString $svc.metricsPort) (toString $svc.containerPort)) }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
            {{- end }}
            {{- if and $svc.grpcPort (ne (toString $svc.grpcPort) (toString $svc.containerPort)) }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          env:
            - name: NEXUSCHAT_ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            {{- range $key, $value := $.Values.global.commonEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $.Values.global.envFromSecrets }}
          envFrom:
            {{- range $.Values.global.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if or $svc.healthPath $svc.readinessPath }}
          livenessProbe:
            httpGet:
              path: {{ default "/health" $svc.healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ default "/ready" $svc.readinessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
{{- end }}
