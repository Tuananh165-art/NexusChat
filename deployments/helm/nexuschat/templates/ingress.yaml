{{- if .Values.ingress.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $svcIngress := default (dict) $svc.ingress }}
{{- $svcIngressEnabled := true }}
{{- if hasKey $svcIngress "enabled" }}
  {{- $svcIngressEnabled = $svcIngress.enabled }}
{{- end }}
{{- if and $svc.enabled $svc.path $svcIngressEnabled }}
{{- $host := default $.Values.global.domain $svcIngress.host }}
{{- $className := default $.Values.ingress.className $svcIngress.className }}
{{- $forwardAuth := default (dict) $svcIngress.traefikForwardAuth }}
{{- $pathType := default "Prefix" $svcIngress.pathType }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexuschat.ingressName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nexuschat.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations:
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $forwardAuth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "nexuschat.traefikMiddlewareRef" (dict "root" $ "name" $name) | quote }}
    {{- end }}
    {{- with $svcIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $className }}
  {{- if and $host $.Values.global.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $.Values.global.tlsSecretName }}
  {{- end }}
  rules:
    -
      {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $svc.path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
