{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexuschat.fullname" . }}-cassandra-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $path, $_ := .Files.Glob "migrations/*.cql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexuschat.fullname" . }}-cassandra-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexuschat.name" . }}-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cassandra-migration
          image: cassandra:4.0
          command:
            - /bin/bash
            - -ec
            - |
              until cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -e "DESCRIBE KEYSPACES"; do sleep 5; done
              cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -e "CREATE KEYSPACE IF NOT EXISTS \"NexusChat\" WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}; USE \"NexusChat\"; CREATE TABLE IF NOT EXISTS schema_migrations (migration_id text PRIMARY KEY, applied_at timestamp);"
              for migration in /migrations/*.cql; do
                migration_id=$(basename "$migration" .cql)
                if cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -e "SELECT migration_id FROM \\\"NexusChat\\\".schema_migrations WHERE migration_id = '$migration_id';" | grep -q "$migration_id"; then continue; fi
                if ! cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -f "$migration"; then
                  if [ "$migration_id" != "004_group_room_avatar" ]; then exit 1; fi
                fi
                cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" -e "INSERT INTO \\\"NexusChat\\\".schema_migrations (migration_id, applied_at) VALUES ('$migration_id', dateOf(now()));"
              done
          env:
            - name: CASSANDRA_HOST
              value: {{ .Values.migration.cassandraHost | quote }}
            - name: CASSANDRA_PORT
              value: {{ .Values.migration.cassandraPort | quote }}
          volumeMounts:
            - name: migration
              mountPath: /migrations
      volumes:
        - name: migration
          configMap:
            name: {{ include "nexuschat.fullname" . }}-cassandra-migration
{{- end }}
