{{- if .Values.serviceMonitor.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "nexuschat.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  endpoints:
    - port: {{ if and $svc.metricsPort (ne (toString $svc.metricsPort) (toString $svc.containerPort)) }}metrics{{ else }}http{{ end }}
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
{{- end }}
{{- end }}
