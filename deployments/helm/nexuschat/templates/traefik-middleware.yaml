{{- range $name, $svc := .Values.services }}
{{- $svcIngress := default (dict) $svc.ingress }}
{{- $forwardAuth := default (dict) $svcIngress.traefikForwardAuth }}
{{- $stripPrefix := default (dict) $svcIngress.traefikStripPrefix }}
{{- if and $.Values.ingress.enabled $svc.enabled $svc.path (or $forwardAuth.enabled $stripPrefix.enabled) }}
---
apiVersion: {{ default "traefik.io/v1alpha1" $.Values.traefik.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "nexuschat.traefikMiddlewareName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nexuschat.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  {{- if $forwardAuth.enabled }}
  forwardAuth:
    address: {{ default (printf "http://chat.%s.svc.cluster.local:%v/api/chat/forwardauth" $.Release.Namespace $.Values.services.chat.containerPort) $forwardAuth.address | quote }}
    trustForwardHeader: {{ default true $forwardAuth.trustForwardHeader }}
    authResponseHeaders:
      {{- range $header := default (list "X-Channel-Id") $forwardAuth.authResponseHeaders }}
      - {{ $header | quote }}
      {{- end }}
  {{- else if $stripPrefix.enabled }}
  stripPrefix:
    prefixes:
      {{- range $prefix := $stripPrefix.prefixes }}
      - {{ $prefix | quote }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
