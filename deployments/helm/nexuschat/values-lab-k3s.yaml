# Minimal lab values for a 4 GB RAM / 50 GB disk server.
# This profile is for demo/dev only, not production.

global:
  environment: lab
  deploymentStrategy:
    type: Recreate
  # The app is routed by this Traefik host. Set it to the DNS name used by the lab.
  # Keep tlsSecretName empty for the HTTP-only profile.
  domain: nexuschat.click
  tlsSecretName: ""
  podAnnotations: {}
  commonEnv:
    KAFKA_ADDRS: kafka.kafka.svc.cluster.local:9092
    KAFKA_VERSION: "3.6.0"
    REDIS_ADDRS: redis-redis-cluster-0.redis-redis-cluster-headless.redis.svc.cluster.local:6379,redis-redis-cluster-1.redis-redis-cluster-headless.redis.svc.cluster.local:6379,redis-redis-cluster-2.redis-redis-cluster-headless.redis.svc.cluster.local:6379
    REDIS_EXPIRATIONHOUR: "24"
    CASSANDRA_HOSTS: cassandra.cassandra.svc.cluster.local
    CASSANDRA_PORT: "9042"
    CASSANDRA_KEYSPACE: NexusChat
    OBSERVABILITY_PROMETHEUS_PORT: ""
    OBSERVABILITY_TRACING_OTLPENDPOINT: ""

imageDefaults:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations: {}

certManager:
  enabled: false
  clusterIssuer:
    create: false
    name: letsencrypt-prod
    email: admin@nexuschat.click
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretName: letsencrypt-prod-account-key
  certificate:
    create: false
    secretName: ""
    dnsNames: []

serviceMonitor:
  enabled: false

networkPolicy:
  enabled: false

services:
  web:
    image:
      fullname: docker.io/tuananh165/nexuschat-web:proxy-upload-v2
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  chat:
    replicas: 1
    env:
      CHAT_HTTP_SERVER_MAXCONN: "50"
      CHAT_MESSAGE_MAXNUM: "500"
      CHAT_MESSAGE_PAGINATIONNUM: "100"
      CHAT_MESSAGE_MAXSIZEBYTE: "2048"
      AI_BASEURL: http://ai-service:8090
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    autoscaling:
      enabled: false

  match:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  user:
    replicas: 1
    env:
      USER_AUTH_COOKIE_DOMAIN: nexuschat.click
      USER_OAUTH_COOKIE_DOMAIN: nexuschat.click
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  uploader:
    image:
      fullname: docker.io/tuananh165/nexuschat-api:proxy-upload
    replicas: 1
    ingress:
      className: traefik
      traefikForwardAuth:
        enabled: false
    env:
      UPLOADER_HTTP_SERVER_MAXBODYBYTE: "10485760"
      UPLOADER_HTTP_SERVER_MAXMEMORYBYTE: "4194304"
      UPLOADER_S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
      UPLOADER_S3_PUBLICENDPOINT: http://s3.nexuschat.click
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  forwarder:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  ai-service:
    replicas: 1
    ingress:
      enabled: false
    command:
      - sh
      - -c
      - python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8090
    env:
      AI_ENVIRONMENT: lab
      # The AI service currently accepts a Redis URL but does not require Redis for startup.
      # Keep it on a Redis Cluster member when the optional integration is enabled.
      REDIS_URL: redis://redis-redis-cluster-0.redis-redis-cluster-headless.redis.svc.cluster.local:6379/0
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    autoscaling:
      enabled: false

  safety:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    autoscaling:
      enabled: false

  discovery:
    replicas: 1
    resources:
      requests:
        cpu: 35m
        memory: 96Mi
      limits:
        cpu: 350m
        memory: 256Mi
    autoscaling:
      enabled: false

  workspace:
    replicas: 1
    resources:
      requests:
        cpu: 35m
        memory: 96Mi
      limits:
        cpu: 350m
        memory: 256Mi
    autoscaling:
      enabled: false

turn:
  enabled: false
