global:
  imageRegistry: docker.io/tuananh165
  imagePullSecrets: []
  environment: staging
  domain: nexuschat.click
  tlsSecretName: ""
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  commonEnv:
    KAFKA_ADDRS: kafka.kafka.svc.cluster.local:9092
    KAFKA_VERSION: "3.6.0"
    REDIS_ADDRS: redis-master.redis.svc.cluster.local:6379
    REDIS_EXPIRATIONHOUR: "24"
    CASSANDRA_HOSTS: cassandra.cassandra.svc.cluster.local
    CASSANDRA_PORT: "9042"
    CASSANDRA_KEYSPACE: NexusChat
    OBSERVABILITY_PROMETHEUS_PORT: "8080"
    OBSERVABILITY_TRACING_OTLPENDPOINT: otel-collector.monitoring.svc.cluster.local:4318
  envFromSecrets:
    - nexuschat-runtime

imageDefaults:
  pullPolicy: IfNotPresent
  tag: latest

ingress:
  enabled: true
  className: traefik
  annotations: {}

certManager:
  enabled: false
  clusterIssuer:
    create: false
    name: letsencrypt-prod
    email: admin@nexuschat.click
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretName: letsencrypt-prod-account-key
  certificate:
    create: true
    secretName: ""
    dnsNames: []

traefik:
  apiVersion: traefik.io/v1alpha1

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

networkPolicy:
  enabled: true

migration:
  enabled: true
  cassandraHost: cassandra.cassandra.svc.cluster.local
  cassandraPort: "9042"

services:
  web:
    enabled: true
    image:
      repository: nexuschat-web
    command: []
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /
    env:
      WEB_HTTP_SERVER_PORT: "8081"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  chat:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["chat"]
    replicas: 3
    containerPort: 8081
    grpcPort: 4000
    metricsPort: 8080
    path: /api/chat
    env:
      CHAT_HTTP_SERVER_PORT: "8081"
      CHAT_HTTP_SERVER_MAXCONN: "200"
      CHAT_HTTP_SERVER_SWAG: "false"
      CHAT_GRPC_SERVER_PORT: "4000"
      CHAT_GRPC_CLIENT_USER_ENDPOINT: user:4000
      CHAT_GRPC_CLIENT_FORWARDER_ENDPOINT: forwarder:4000
      CHAT_GRPC_CLIENT_SAFETY_ENDPOINT: safety:4003
      CHAT_MESSAGE_MAXNUM: "5000"
      CHAT_MESSAGE_PAGINATIONNUM: "5000"
      CHAT_MESSAGE_MAXSIZEBYTE: "4096"
      CHAT_JWT_EXPIRATIONSECOND: "86400"
      AI_BASEURL: http://ai-service:8090
      AI_REQUESTTIMEOUTMILLI: "30000"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65

  match:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["match"]
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /api/match
    env:
      MATCH_HTTP_SERVER_PORT: "8081"
      MATCH_HTTP_SERVER_MAXCONN: "200"
      MATCH_HTTP_SERVER_SWAG: "false"
      MATCH_GRPC_CLIENT_CHAT_ENDPOINT: chat:4000
      MATCH_GRPC_CLIENT_USER_ENDPOINT: user:4000
      MATCH_GRPC_CLIENT_SAFETY_ENDPOINT: safety:4003
      MATCH_GRPC_CLIENT_DISCOVERY_ENDPOINT: discovery:4004
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  user:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["user"]
    replicas: 2
    containerPort: 8081
    grpcPort: 4000
    metricsPort: 8080
    path: /api/user
    env:
      USER_HTTP_SERVER_PORT: "8081"
      USER_HTTP_SERVER_SWAG: "false"
      USER_GRPC_SERVER_PORT: "4000"
      USER_AUTH_COOKIE_DOMAIN: nexuschat.example.com
      USER_OAUTH_COOKIE_DOMAIN: nexuschat.example.com
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  uploader:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["uploader"]
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /api/uploader
    env:
      UPLOADER_HTTP_SERVER_PORT: "8081"
      UPLOADER_HTTP_SERVER_SWAG: "false"
      UPLOADER_HTTP_SERVER_MAXBODYBYTE: "67108864"
      UPLOADER_HTTP_SERVER_MAXMEMORYBYTE: "16777216"
      UPLOADER_S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
      UPLOADER_S3_PUBLICENDPOINT: https://assets.nexuschat.example.com
      UPLOADER_S3_REGION: us-east-1
      UPLOADER_S3_BUCKET: myfilebucket
    ingress:
      className: traefik
      traefikForwardAuth:
        enabled: true
        address: http://chat.nexuschat-prod.svc.cluster.local:8081/api/chat/forwardauth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Channel-Id
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  forwarder:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["forwarder"]
    replicas: 2
    containerPort: 4000
    grpcPort: 4000
    metricsPort: 8080
    path: ""
    env:
      FORWARDER_GRPC_SERVER_PORT: "4000"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  ai-service:
    enabled: true
    image:
      repository: nexuschat-ai-service
    command: []
    replicas: 2
    ingress:
      pathType: Prefix
      traefikStripPrefix:
        enabled: true
        prefixes:
          - /api/ai
    containerPort: 8090
    metricsPort: 8090
    path: /api/ai
    healthPath: /health
    readinessPath: /ready
    env:
      AI_HOST: 0.0.0.0
      AI_PORT: "8090"
      AI_ENVIRONMENT: staging
      REDIS_URL: redis://redis-master.redis.svc.cluster.local:6379/0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  safety:
    enabled: true
    image:
      repository: nexuschat-safety
    command: ["safety"]
    replicas: 2
    containerPort: 5005
    grpcPort: 4003
    metricsPort: 8080
    path: /api/safety
    env:
      SAFETY_HTTP_SERVER_PORT: "5005"
      SAFETY_GRPC_SERVER_PORT: "4003"
      SAFETY_WARN_SCORE: "40"
      SAFETY_BLOCK_SCORE: "70"
      SAFETY_RATE_LIMIT_WINDOWSECOND: "10"
      SAFETY_RATE_LIMIT_MAXMESSAGES: "12"
      SAFETY_RATE_LIMIT_MUTESECOND: "30"
      SAFETY_WORKERS: "4"
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 384Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  discovery:
    enabled: true
    image:
      repository: nexuschat-discovery
    command: ["discovery"]
    replicas: 2
    containerPort: 5006
    grpcPort: 4004
    metricsPort: 8080
    path: /api/discovery
    env:
      DISCOVERY_HTTP_SERVER_PORT: "5006"
      DISCOVERY_GRPC_SERVER_PORT: "4004"
      DISCOVERY_GRPC_CLIENT_SAFETY_ENDPOINT: "safety:4003"
      DISCOVERY_CANDIDATELIMIT: "20"
      DISCOVERY_RECENTPEERDAY: "7"
      DISCOVERY_WORKERS: "4"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  workspace:
    enabled: true
    image:
      repository: nexuschat-workspace
    command: ["workspace"]
    replicas: 2
    containerPort: 5007
    grpcPort: 4005
    metricsPort: 8080
    path: /api/workspace
    env:
      WORKSPACE_HTTP_SERVER_PORT: "5007"
      WORKSPACE_GRPC_SERVER_PORT: "4005"
      WORKSPACE_GRPC_CLIENT_CHAT_ENDPOINT: "chat:4000"
      WORKSPACE_WORKERS: "4"
      WORKSPACE_REMINDERPOLLSECOND: "15"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

turn:
  enabled: false
