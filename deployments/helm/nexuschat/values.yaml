global:
  imageRegistry: docker.io/tuananh165
  imagePullSecrets: []
  environment: staging
  domain: nexuschat.click
  tlsSecretName: nexuschat-click-tls
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  commonEnv:
    KAFKA_ADDRS: kafka.kafka.svc.cluster.local:9092
    KAFKA_VERSION: "3.6.0"
    REDIS_ADDRS: redis-master.redis.svc.cluster.local:6379
    REDIS_EXPIRATIONHOUR: "24"
    CASSANDRA_HOSTS: cassandra.cassandra.svc.cluster.local
    CASSANDRA_PORT: "9042"
    CASSANDRA_KEYSPACE: NexusChat
    OBSERVABILITY_PROMETHEUS_PORT: "8080"
    OBSERVABILITY_TRACING_OTLPENDPOINT: otel-collector.monitoring.svc.cluster.local:4318
  envFromSecrets:
    - nexuschat-runtime
  podAnnotations:
    consul.hashicorp.com/connect-inject: "true"
    consul.hashicorp.com/transparent-proxy: "true"
    consul.hashicorp.com/transparent-proxy-exclude-outbound-ports: "443"

imageDefaults:
  pullPolicy: IfNotPresent
  tag: latest

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

traefik:
  apiVersion: traefik.io/v1alpha1

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

networkPolicy:
  enabled: true

consul:
  serviceDefaults:
    enabled: true

services:
  web:
    enabled: true
    image:
      repository: nexuschat-web
    command: []
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /
    env:
      WEB_HTTP_SERVER_PORT: "8081"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  chat:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["chat"]
    replicas: 3
    containerPort: 8081
    grpcPort: 4000
    metricsPort: 8080
    path: /api/chat
    env:
      CHAT_HTTP_SERVER_PORT: "8081"
      CHAT_HTTP_SERVER_MAXCONN: "200"
      CHAT_HTTP_SERVER_SWAG: "false"
      CHAT_GRPC_SERVER_PORT: "4000"
      CHAT_GRPC_CLIENT_USER_ENDPOINT: user:4000
      CHAT_GRPC_CLIENT_FORWARDER_ENDPOINT: forwarder:4000
      CHAT_MESSAGE_MAXNUM: "5000"
      CHAT_MESSAGE_PAGINATIONNUM: "5000"
      CHAT_MESSAGE_MAXSIZEBYTE: "4096"
      CHAT_JWT_EXPIRATIONSECOND: "86400"
      AI_BASEURL: http://ai-service:8090
      AI_REQUESTTIMEOUTMILLI: "30000"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65

  match:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["match"]
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /api/match
    env:
      MATCH_HTTP_SERVER_PORT: "8081"
      MATCH_HTTP_SERVER_MAXCONN: "200"
      MATCH_HTTP_SERVER_SWAG: "false"
      MATCH_GRPC_CLIENT_CHAT_ENDPOINT: chat:4000
      MATCH_GRPC_CLIENT_USER_ENDPOINT: user:4000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  user:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["user"]
    replicas: 2
    containerPort: 8081
    grpcPort: 4000
    metricsPort: 8080
    path: /api/user
    env:
      USER_HTTP_SERVER_PORT: "8081"
      USER_HTTP_SERVER_SWAG: "false"
      USER_GRPC_SERVER_PORT: "4000"
      USER_AUTH_COOKIE_DOMAIN: nexuschat.example.com
      USER_OAUTH_COOKIE_DOMAIN: nexuschat.example.com
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  uploader:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["uploader"]
    replicas: 2
    containerPort: 8081
    metricsPort: 8080
    path: /api/uploader
    env:
      UPLOADER_HTTP_SERVER_PORT: "8081"
      UPLOADER_HTTP_SERVER_SWAG: "false"
      UPLOADER_HTTP_SERVER_MAXBODYBYTE: "67108864"
      UPLOADER_HTTP_SERVER_MAXMEMORYBYTE: "16777216"
      UPLOADER_S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
      UPLOADER_S3_PUBLICENDPOINT: https://assets.nexuschat.example.com
      UPLOADER_S3_REGION: us-east-1
      UPLOADER_S3_BUCKET: myfilebucket
    ingress:
      className: traefik
      traefikForwardAuth:
        enabled: true
        address: http://chat.nexuschat-prod.svc.cluster.local:8081/api/chat/forwardauth
        trustForwardHeader: true
        authResponseHeaders:
          - X-Channel-Id
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  forwarder:
    enabled: true
    image:
      repository: nexuschat-api
    command: ["forwarder"]
    replicas: 2
    containerPort: 4000
    grpcPort: 4000
    metricsPort: 8080
    path: ""
    env:
      FORWARDER_GRPC_SERVER_PORT: "4000"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  ai-service:
    enabled: true
    image:
      repository: nexuschat-ai-service
    command: []
    replicas: 2
    ingress:
      pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
    containerPort: 8090
    metricsPort: 8090
    path: /api/ai(/|$)(.*)
    healthPath: /health
    readinessPath: /ready
    env:
      AI_HOST: 0.0.0.0
      AI_PORT: "8090"
      AI_ENVIRONMENT: staging
      REDIS_URL: redis://redis-master.redis.svc.cluster.local:6379/0
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  presence:
    enabled: true
    image:
      repository: nexuschat-presence
    command: ["presence"]
    replicas: 2
    containerPort: 5005
    grpcPort: 4003
    metricsPort: 8080
    path: /api/presence
    env:
      PRESENCE_HTTP_SERVER_PORT: "5005"
      PRESENCE_GRPC_SERVER_PORT: "4003"
      PRESENCE_HEARTBEATSECOND: "15"
      PRESENCE_TTLSECOND: "45"
      CHAT_JWT_EXPIRATIONSECOND: "86400"
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 384Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  notification:
    enabled: true
    image:
      repository: nexuschat-notification
    command: ["notification"]
    replicas: 2
    containerPort: 5006
    grpcPort: 4004
    metricsPort: 8080
    path: /api/notifications
    env:
      NOTIFICATION_HTTP_SERVER_PORT: "5006"
      NOTIFICATION_GRPC_SERVER_PORT: "4004"
      NOTIFICATION_GRPC_CLIENT_PRESENCE_ENDPOINT: "presence:4003"
      NOTIFICATION_RETENTIONDAY: "90"
      NOTIFICATION_VAPID_SUBJECT: "mailto:admin@nexuschat.click"
      CHAT_JWT_EXPIRATIONSECOND: "86400"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

  call:
    enabled: true
    image:
      repository: nexuschat-call
    command: ["call"]
    replicas: 2
    containerPort: 5007
    grpcPort: 4005
    metricsPort: 8080
    path: /api/calls
    env:
      CALL_HTTP_SERVER_PORT: "5007"
      CALL_GRPC_SERVER_PORT: "4005"
      CALL_GRPC_CLIENT_PRESENCE_ENDPOINT: "presence:4003"
      CALL_GRPC_CLIENT_CHAT_ENDPOINT: "chat:4000"
      CALL_RINGTIMEOUTSECOND: "30"
      CALL_RECONNECTGRACESECOND: "15"
      CALL_ACTIVETTLSECOND: "7200"
      CALL_RETENTIONDAY: "30"
      CALL_TURN_URLS: "stun:stun.l.google.com:19302,turn:turn.nexuschat.click:3478"
      CALL_TURN_TTLSECOND: "3600"
      CHAT_JWT_EXPIRATIONSECOND: "86400"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 700m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70

turn:
  enabled: false
  image: coturn/coturn:4.6.2
  realm: nexuschat.click
  minPort: 49160
  maxPort: 49200
