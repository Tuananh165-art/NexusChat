# K3s lab profile. Create Secret grafana-admin in namespace monitoring before install.
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 2Gi
  service:
    type: NodePort
    port: 80
    targetPort: 3000
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 5GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/component,app.kubernetes.io/part-of]
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
