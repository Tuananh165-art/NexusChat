apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nexuschat-restricted-workloads
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nexuschat-staging
                - nexuschat-prod
      validate:
        message: NexusChat pods must run as non-root.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nexuschat-staging
                - nexuschat-prod
      validate:
        message: Containers must disable privilege escalation.
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nexuschat-staging
                - nexuschat-prod
      validate:
        message: Containers must define requests and limits.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
