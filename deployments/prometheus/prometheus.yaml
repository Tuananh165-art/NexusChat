global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: nexuschat
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8080
          - ai-service:8090
          - random-chat:8080
          - forwarder:8080
          - match:8080
          - uploader:8080
          - user:8080
          - safety:8080
          - discovery:8080
          - workspace:8080
