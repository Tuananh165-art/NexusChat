syntax = "proto3";

package nexuschat.call.v1;

option go_package = "github.com/Tuananh165-art/NexusChat/proto/call";

message CallRequest {
  string call_id = 1;
  string user_id = 2;
  string channel_id = 3;
}

message CallResponse {
  string call_id = 1;
  bool authorized = 2;
  string state = 3;
}

service CallService {
  rpc GetActiveCall(CallRequest) returns (CallResponse);
  rpc AuthorizeParticipant(CallRequest) returns (CallResponse);
  rpc EndCall(CallRequest) returns (CallResponse);
}
